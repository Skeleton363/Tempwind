# Phase 2 M2: build Wine's Unix side (ntdll's Unix part and wineserver) with
# Emscripten as one wasm64 module, run `npm run test:wine`, and publish
# `wine-unix-<sha7>` (docs/design/wine-unix.md, sections 2 and 10). Tests that
# don't build fetch the release named by tests/targets/wine-unix.lock.
name: wine-unix

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "native/wine/**"
      - "runtime/src/**"
      - "tests/wine/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "tests/native/**"
      - "tests/node/v3-mini.mjs"
      - "crates/x64wasm/**"
      - "crates/x64wasm-cli/**"
      - "crates/x64wasm-rt/**"
      - "crates/x64wasm-fp/**"
      - "tests/targets/sources.json"
      - "tests/targets/wine.lock"
      - "scripts/emcc.sh"
      - "scripts/fetch-artifact.sh"
      - "scripts/release-publish.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wine-unix.yml"
  pull_request:
    paths:
      - "native/wine/**"
      - "runtime/src/**"
      - "tests/wine/**"
      - "tests/browser/**"
      - "playwright.config.mjs"
      - "tests/native/**"
      - "tests/node/v3-mini.mjs"
      - "crates/x64wasm/**"
      - "crates/x64wasm-cli/**"
      - "crates/x64wasm-rt/**"
      - "crates/x64wasm-fp/**"
      - "tests/targets/sources.json"
      - "tests/targets/wine.lock"
      - "scripts/emcc.sh"
      - "scripts/fetch-artifact.sh"
      - "scripts/release-publish.sh"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/wine-unix.yml"

permissions:
  contents: write

concurrency:
  group: wine-unix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # The commit under test (a pull request run checks out a merge commit).
  SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    # A branch with a pull request runs on its push event only.
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show

      - uses: Swatinem/rust-cache@v2

      # scripts/emcc.sh keeps Emscripten's cache here (docker's /emcache).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tempwind
          key: wine-unix-emcache-${{ hashFiles('scripts/emcc.sh') }}-${{ hashFiles('native/wine/build.sh') }}
          restore-keys: |
            wine-unix-emcache-${{ hashFiles('scripts/emcc.sh') }}-
            wine-unix-emcache-

      # Fetches the Wine 11 release (target/wine: hello.exe, kuser.bin, native tree),
      # builds the Unix side with native/wine/build.sh into target/wine-unix, then
      # packages the release (rebase, catalog, boot-set.json).
      - name: Prepare the inputs and build the Unix side
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd gcc-mingw-w64-x86-64
          tests/wine/prepare.sh

      # The catalog gate (docs/design/wine-build.md, "Where it is built"): prepare.sh
      # rebased and verified the whole closure; this translates it with the shared-memory
      # options, and every module compiled in V8. A failure names the file.
      - name: Catalog gate (translate the whole closure, compile in V8)
        run: |
          set -euo pipefail
          node tests/wine/catalog.mjs --all
          node tests/wine/catalog.mjs --check --all

      - name: npm run test:wine
        run: |
          set -euo pipefail
          npm ci
          npm run test:wine

      # hello.exe in a Chromium Worker, through the browser host (wine-unix.md,
      # section 10): the server maps target/wine and target/wine-unix by default.
      - name: npm run test:browser:wine
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          npm run test:browser:wine

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/wine-unix/wine-unix.{mjs,wasm} target/wine-unix/test-*.{mjs,wasm} target/wine-unix/build-info.json dist/
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: wine-unix
          path: dist

      # What `run-wine.mjs` reads (target/wine without the release tarballs, target/wine-unix and the two
      # wasm32 helpers), for the matrix job below.
      - name: Pack the inputs of run-wine.mjs
        run: |
          set -euo pipefail
          tar -C target --exclude='wine/*.tar.zst' --exclude='wine/*.sha256' -I 'zstd -T0 -3' -cf wine-inputs.tar.zst \
            wine wine-unix wasm32-unknown-unknown/release/x64wasm_rt.wasm wasm32-unknown-unknown/release/x64wasm_fp.wasm
          ls -l wine-inputs.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: wine-inputs
          path: wine-inputs.tar.zst
          retention-days: 3
          compression-level: 0

  # The 7-Zip command matrix on this workflow's own Unix side and catalog (tests/sevenzip/README.md):
  # 7zz.exe through run-wine.mjs --dir, one process per step, compared byte for byte with
  # tests/sevenzip/expected/. It is red until 7zz.exe runs on this Wine (Phase 2 M4 WP5), so `publish`
  # does not depend on it.
  sevenzip-matrix:
    needs: build
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: wine-inputs
          path: inputs
      - name: Unpack the inputs and fetch 7zz.exe (targets release)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          mkdir -p target
          tar -C target -I zstd -xf inputs/wine-inputs.tar.zst
          scripts/fetch-artifact.sh "$(cat tests/targets/targets.lock)" 7zz.exe target/targets
      - name: 7-Zip command matrix on Wine, compared with the expected results
        run: |
          set -euo pipefail
          bad=0
          node tests/sevenzip/matrix.mjs --mode translated --out target/sevenzip-out --jobs "$(nproc)" --quiet || bad=1
          node tests/sevenzip/compare.mjs target/sevenzip-out tests/sevenzip/expected || bad=1
          exit $bad
      - name: Upload the 7-Zip matrix results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: sevenzip-wine
          path: target/sevenzip-out/results
          if-no-files-found: ignore

  # Publish only from a push or a manual run of this repository's branches; the
  # release starts as soon as the build and its tests pass.
  publish:
    needs: build
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'claude/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v8
        with:
          name: wine-unix
          path: dist
      - name: Create release wine-unix-<sha7>
        run: |
          set -euo pipefail
          tag="wine-unix-${SHA:0:7}"
          notes="Wine 11.0's Unix side (ntdll Unix part and wineserver, Emscripten wasm64) built by workflow run $RUN_URL at commit $SHA: wine-unix.{mjs,wasm}, the test modules and build-info.json (docs/design/wine-unix.md)."
          # Creates the release if needed, keeps assets it already has, retries transient API errors.
          scripts/release-publish.sh "$tag" "$notes" dist/*
          echo "Published $tag" >> "$GITHUB_STEP_SUMMARY"

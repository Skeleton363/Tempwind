[workspace]
resolver = "3"
members = ["crates/x64wasm", "crates/x64wasm-cli", "crates/x64wasm-rt", "crates/testkit"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/skeleton363/tempwind"
publish = false

[workspace.dependencies]
x64wasm = { path = "crates/x64wasm" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "code_asm", "intel", "instr_info"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10.9", default-features = false }
wasm-encoder = "0.262.0"
wasmparser = "0.262.0"
wasmprinter = "0.262.0"
wasmtime = { version = "50.0.0", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "threads"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"

[profile.dev.package."*"]
opt-level = 1

# The run-time translator (x64wasm_rt.wasm) is downloaded by the browser:
# small over fast. Overrides apply to the wasm32 build and the native rlib.
[profile.release.package.x64wasm-rt]
opt-level = "s"
strip = true
